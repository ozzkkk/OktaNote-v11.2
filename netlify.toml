[build]
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# OCR: .gz dosyası SUNUCUDA AÇILMAMALI. Tarayıcıya sıkıştırılmış hâli gitmeli;
# Tesseract.js kendi içinde açar. Content-Encoding: gzip verilirse çift açma hatası olur.
[[headers]]
  for = "/tur.traineddata.gz"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Encoding = "identity"
    Cache-Control = "public, max-age=31536000, immutable"

# WASM çekirdeği .js uzantılı ama içinde ikili WASM var: JS olarak servis edilmeli,
# MIME sniffing kapatıldığı için doğru Content-Type şart.
[[headers]]
  for = "/tesseract-core-simd-lstm.wasm.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/tesseract.min.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/tesseract-worker.min.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
